name: Release

# A push to main publishes the :main image only. A release is a vX.Y.Z tag
# on a commit whose versions already say X.Y.Z (scripts/release.sh); CI
# never commits to main.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: CI
    uses: ./.github/workflows/ci.yml

  conformance:
    name: Gateway API Conformance
    uses: ./.github/workflows/conformance.yml

  publish:
    name: Publish
    needs: [check, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.ref_type }}" = tag ]; then
            TAG="${{ github.ref_name }}"
            BARE="${TAG#v}"
            # The tag must name the version the binary, the conformance
            # report and deploy/install already carry, or `portail --version`
            # would disagree with the image, or install.yaml run another one.
            CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
            CONFORMANCE=$(sed -n 's/.*portailVersion *= *"\(v[^"]*\)".*/\1/p' conformance/conformance_test.go)
            INSTALL=$(kubectl kustomize deploy/install | sed -n 's/^ *image: \(.*\)$/\1/p')
            if [ "$CARGO" != "$BARE" ] || [ "$CONFORMANCE" != "$TAG" ] || [ "${INSTALL##*:}" != "$BARE" ]; then
              echo "::error::tag $TAG but Cargo.toml says $CARGO, conformance says $CONFORMANCE and deploy/install runs $INSTALL; run scripts/release.sh $BARE first"
              exit 1
            fi
            {
              echo "release=$TAG"
              echo "bake=$IMAGE:$BARE"
              echo "list<<EOF"
              echo "$IMAGE:$BARE"
              echo "$IMAGE:${BARE%.*}"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "bake=$IMAGE:sha-${{ github.sha }}"
              echo "list<<EOF"
              echo "$IMAGE:main"
              echo "$IMAGE:sha-${{ github.sha }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # The controller's default data-plane image: the immutable tag of
          # this very build. Cargo's version moves only at release, so a :main
          # controller would otherwise render the previous release.
          build-args: PORTAIL_IMAGE=${{ steps.tags.outputs.bake }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        if: steps.tags.outputs.release != ''
        run: |
          kubectl kustomize deploy/install > install.yaml
          gh release create "${{ steps.tags.outputs.release }}" install.yaml --title "${{ steps.tags.outputs.release }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
