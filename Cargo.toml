[package]
name = "portail"
version = "0.1.29"
edition = "2021"
authors = ["Portail Contributors"]
description = "Kubernetes Gateway API Controller"
license = "Apache-2.0"
repository = "https://github.com/epheo/portail"

[dependencies]
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
dashmap = "6"
socket2 = { version = "0.6.0", features = ["all"] }
libc = "0.2"
# Raise CAP_NET_BIND_SERVICE (permitted->effective) for direct privileged binds
# in multi-network/UDN and host-network modes. See src/privileges.rs.
caps = "0.5"
fastrand = "2"
fnv = "1.0"
memchr = "2"
regex = "1"
# Parses a route regex on its own before it is anchored. Already in the
# tree via regex; this only promotes it to a direct dependency.
regex-syntax = "0.8"
arc-swap = "1"
anyhow = "1.0"
bytes = "1"
h2 = "0.4"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration and CLI dependencies
serde_yaml = "0.9"
# env: the namespace and controller CA defaults of the subcommands.
clap = { version = "4.0", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# TLS dependencies
rustls = "0.23"
tokio-rustls = "0.26"
pin-project-lite = "0.2"

# Kubernetes Gateway API controller
kube = { version = "2", features = ["runtime", "client", "derive", "unstable-runtime"] }
k8s-openapi = { version = "0.26", features = ["v1_32"] }
gateway-api = { version = "0.19", features = ["experimental"] }
futures = "0.3"
# CRD schema generation for portail's own policy types; already in the tree
# via gateway-api, this only promotes it to a direct dependency.
schemars = "1"

# Controller/data-plane sync (HTTP/1.1 long-poll over TLS). Already in the
# tree through kube-client; these promote them and add the server half.
hyper = { version = "1.12", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Snapshot version and naming hashes (SHA-256), already linked by rustls.
aws-lc-rs = "1.18"
# Unverified JWT claims pre-check before a TokenReview; already in the tree.
base64 = "0.22"
# The controller's own CA and serving cert, on the same aws-lc-rs backend
# rustls uses instead of rcgen's default ring.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }





[dev-dependencies]
tokio = { version = "1.40", features = ["test-util"] }
criterion = "0.7"
# rewrk-core speaks hyper 0.14; the sync code uses hyper 1.
hyper_014 = { package = "hyper", version = "0.14" }
libc = "0.2"
rewrk-core = "0.1.3"
tempfile = "3"
# service_fn for a mock kube Client in controller tests; kube already builds tower.
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "routing_bench"
harness = false

[[bench]]
name = "parsing_bench"
harness = false

[[bench]]
name = "sniff_bench"
harness = false

[[bench]]
name = "end_to_end_bench"
harness = false

[[bench]]
name = "proxy_throughput"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Release build optimized for production
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
lto = false  # Disable LTO for better symbol visibility

[profile.bench]
debug = true

# Profiling-optimized release build
[profile.profiling]
inherits = "release"
debug = 2          # Full debug info
strip = false      # Keep all symbols
lto = false        # Disable link-time optimization for symbol visibility
opt-level = 3      # Keep high optimization
codegen-units = 1  # Single codegen unit for better profiling
overflow-checks = false
