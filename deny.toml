[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, no known vulnerability; pulled in by serde_yaml, which kube-client and gateway-api also use" },
    { id = "RUSTSEC-2026-0258", reason = "only h2 0.3, dev-only via rewrk-core's hyper 0.14 (bench); no 0.3 fix exists; the shipped h2 0.4 is patched" },
]

[licenses]
# Permissive and Apache-2.0 compatible only.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
