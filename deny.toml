[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, no known vulnerability; pulled in only by portail's own serde_yaml, now that kube and gateway-api use other YAML crates" },
    { id = "RUSTSEC-2026-0258", reason = "only h2 0.3, dev-only via rewrk-core's hyper 0.14 (bench); no 0.3 fix exists; the shipped h2 0.4 is patched" },
]

[licenses]
# Permissive and Apache-2.0 compatible only.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Mozilla's root list as data: a wasm32-only dependency of
# rustls-platform-verifier (through kube-client), never built for Linux.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"

# One TLS stack to the apiserver: this connector also trusted OpenSSL's
# default roots beside the cluster CA until kube 5.2 (RUSTSEC-2026-0600).
[[bans.features]]
crate = "kube-client"
deny = ["openssl-tls"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
