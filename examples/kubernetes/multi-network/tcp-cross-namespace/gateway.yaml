# In tenant-frontend: the ClusterUserDefinedNetworks attach only pods of
# namespaces they select, and a Gateway's data plane runs in its namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-frontend
  namespace: tenant-frontend
spec:
  gatewayClassName: portail
  infrastructure:
    parametersRef:
      group: portail.epheo.eu
      kind: GatewayParameters
      name: gw-frontend
  addresses:
  - type: portail.epheo.eu/Network
    value: vpc-frontend
  listeners:
  - name: tcp-postgres
    port: 5432
    protocol: TCP
  - name: tcp-ssh
    port: 2222
    protocol: TCP
