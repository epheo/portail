# Without it, the Gateway API refuses a backendRef into another namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-tenant-frontend-routes
  namespace: tenant-backend
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: TCPRoute
    namespace: tenant-frontend
  to:
  - group: ""
    kind: Service
