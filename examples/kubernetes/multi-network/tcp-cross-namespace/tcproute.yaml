# The ReferenceGrant in tenant-backend permits the cross-namespace backendRef.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: frontend-to-postgres
  namespace: tenant-frontend
spec:
  parentRefs:
  - name: gw-frontend
    sectionName: tcp-postgres
  rules:
  - backendRefs:
    - name: postgres
      namespace: tenant-backend
      port: 5432
