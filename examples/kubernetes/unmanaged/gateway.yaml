apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: portail-system
spec:
  gatewayClassName: portail
  infrastructure:
    parametersRef:
      group: portail.epheo.eu
      kind: GatewayParameters
      name: unmanaged
  listeners:
  - name: http
    port: 80
    protocol: HTTP
