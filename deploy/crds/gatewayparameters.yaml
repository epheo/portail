apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatewayparameters.portail.epheo.eu
spec:
  group: portail.epheo.eu
  names:
    categories: []
    kind: GatewayParameters
    plural: gatewayparameters
    shortNames:
    - gwp
    singular: gatewayparameters
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provisioning
      name: Provisioning
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.service.type
      name: Service
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for GatewayParametersSpec via `CustomResource`
        properties:
          spec:
            description: |-
              How a Gateway's data plane is run. Built-in defaults, then the
              GatewayClass's parameters, then the Gateway's: a set field wins field by
              field; `networks`, `resources` and `proxyProtocol` replace whole.
            properties:
              controllerTransport:
                description: |-
                  How the data-plane pods reach the controller (Managed). Direct: its
                  Service. APIServerProxy: through the apiserver's service proxy, for
                  pods that reach only the apiserver (OVN-Kubernetes Primary UDN); the
                  Gateway's ServiceAccount needs the Role of
                  deploy/components/apiserver-proxy. Default Direct.
                enum:
                - Direct
                - APIServerProxy
                - null
                nullable: true
                type: string
              externalNameBackends:
                description: |-
                  Routes to Services of type ExternalName, Managed or not. Refused: the
                  backendRef is ResolvedRefs=False InvalidKind and its share answers
                  500, so a route's author cannot make the Gateway dial any name it
                  likes (Gateway API: implementations SHOULD NOT support them,
                  CVE-2021-25740). Allowed: the data plane dials the name. Default
                  Refused.
                enum:
                - Refused
                - Allowed
                - null
                nullable: true
                type: string
              image:
                description: |-
                  Data-plane image (Managed). Default: the controller's
                  `--dataplane-image`.
                minLength: 1
                nullable: true
                type: string
              networks:
                description: |-
                  Multus attachments of the data-plane pods (Managed), as
                  NetworkSelectionElements.
                items:
                  description: The Multus NetworkSelectionElement fields a data plane needs.
                  properties:
                    gateway:
                      items:
                        type: string
                      nullable: true
                      type: array
                    interface:
                      description: The interface name in the pod.
                      minLength: 1
                      nullable: true
                      type: string
                    ips:
                      description: Static addresses in CIDR form, e.g. 172.16.87.21/24.
                      items:
                        type: string
                      nullable: true
                      type: array
                    listeners:
                      description: |-
                        Whether listeners bind on this network. false: the data planes
                        only dial out on it, reaching Gateway backends and being trusted
                        there by the Gateways that name this one; a Gateway with such a
                        network binds its unaddressed listeners on every local IP outside
                        it. Default true.
                      nullable: true
                      type: boolean
                    mac:
                      minLength: 1
                      nullable: true
                      type: string
                    name:
                      description: The NetworkAttachmentDefinition.
                      type: string
                    namespace:
                      description: Its namespace; default the pod's.
                      nullable: true
                      type: string
                  required:
                  - name
                  type: object
                nullable: true
                type: array
              provisioning:
                description: |-
                  Managed: the controller creates the Gateway's ServiceAccount,
                  Deployment, Service and PodDisruptionBudget. Unmanaged: it serves
                  the configuration and writes status; the pods are the owner's.
                  Default Managed.
                enum:
                - Managed
                - Unmanaged
                - null
                nullable: true
                type: string
              proxyProtocol:
                description: |-
                  PROXY protocol v2 on the data plane's TCP listeners, Managed or not.
                  Replaces whole: a Gateway's own list is never added to its class's.
                nullable: true
                properties:
                  trustedSources:
                    description: |-
                      Sources whose connections must open with a v2 header: the client
                      it names stands for the connection (X-Forwarded-For, access logs,
                      rate limits). One that sends no header, or a malformed one, is
                      closed; LOCAL keeps the connection's own address. Other sources are
                      never read for one. Empty: none. Matched per accepted connection.
                    items:
                      description: Exactly one of `cidr` or `gateway`.
                      properties:
                        cidr:
                          description: |-
                            An IPv4 or IPv6 CIDR, network address only: 10.250.0.0/16, not
                            10.250.0.7/16. Never a network other workloads share: any of them
                            could name any client.
                          minLength: 1
                          nullable: true
                          type: string
                        gateway:
                          description: |-
                            A Gateway of this controller: the address each of its live data
                            planes reports on a Network both Gateways name, inside its CIDRs on
                            both sides, bound there or not. Nothing while none reports
                            or this Gateway has no Network address.
                          nullable: true
                          properties:
                            name:
                              minLength: 1
                              type: string
                            namespace:
                              minLength: 1
                              type: string
                          required:
                          - name
                          - namespace
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of cidr or gateway
                        rule: has(self.cidr) != has(self.gateway)
                    maxItems: 16
                    nullable: true
                    type: array
                type: object
              replicas:
                description: |-
                  Data-plane pods (Managed). Default 1; static `networks[].ips`
                  require 1.
                format: int32
                minimum: 1.0
                nullable: true
                type: integer
              resources:
                description: |-
                  Data-plane container resources (Managed), a core/v1
                  ResourceRequirements; its worker threads follow the cpu limit.
                  Default requests 100m/64Mi, limits 2/256Mi.
                nullable: true
                properties:
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    type: object
                type: object
              service:
                nullable: true
                properties:
                  type:
                    description: |-
                      The Service fronting the data plane; None creates none. Unset:
                      None when the Gateway has a Network address or `networks` it
                      listens on, else LoadBalancer.
                    enum:
                    - LoadBalancer
                    - ClusterIP
                    - NodePort
                    - None
                    - null
                    nullable: true
                    type: string
                type: object
            type: object
        required:
        - spec
        title: GatewayParameters
        type: object
    served: true
    storage: true
    subresources: {}
