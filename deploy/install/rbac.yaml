apiVersion: v1
kind: ServiceAccount
metadata:
  name: portail-controller
  namespace: portail-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portail-controller
rules:
- apiGroups: [gateway.networking.k8s.io]
  resources: [gatewayclasses, gateways, httproutes, tcproutes, tlsroutes, udproutes, referencegrants]
  verbs: [get, list, watch]
- apiGroups: [gateway.networking.k8s.io]
  resources: [gatewayclasses/status, gateways/status, httproutes/status, tcproutes/status, tlsroutes/status, udproutes/status]
  verbs: [patch]
- apiGroups: [portail.epheo.eu]
  resources: [ratelimitpolicies, gatewayparameters]
  verbs: [get, list, watch]
- apiGroups: [portail.epheo.eu]
  resources: [ratelimitpolicies/status]
  verbs: [patch]
# Secrets: RBAC cannot narrow a read to the TLS Secrets Gateways reference.
- apiGroups: [""]
  resources: [namespaces, secrets]
  verbs: [get, list, watch]
# Per-Gateway objects. Server-side apply creates through patch, but the
# apiserver still asks for create; create cannot be scoped by name.
- apiGroups: [""]
  resources: [services, serviceaccounts]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list, watch, create, patch, delete]
# A headless backend's named targetPort: a one-shot list, never a watch.
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [list]
# A portail.epheo.eu/Network address names a NetworkAttachmentDefinition.
- apiGroups: [k8s.cni.cncf.io]
  resources: [network-attachment-definitions]
  verbs: [get]
# Data planes authenticate with projected tokens of the controller audience.
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portail-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portail-controller
subjects:
- kind: ServiceAccount
  name: portail-controller
  namespace: portail-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portail-controller
  namespace: portail-system
rules:
# create cannot be scoped by name; every other lease verb is, to the
# --leader-election-id default.
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  resourceNames: [portail-controller]
  verbs: [get, update]
# The CA is written once and never updated: rotation deletes the Secret.
# Reading it uses the cluster-wide secrets read.
- apiGroups: [""]
  resources: [secrets, configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [portail-controller-ca]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portail-controller
  namespace: portail-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portail-controller
subjects:
- kind: ServiceAccount
  name: portail-controller
  namespace: portail-system
