apiVersion: apps/v1
kind: Deployment
metadata:
  name: portail-controller
  namespace: portail-system
  labels:
    app.kubernetes.io/name: portail-controller
spec:
  replicas: 1
  # The new pod starts as a standby and takes the lease the old one
  # releases on exit: one retry of controller gap, never two leaders.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: portail-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portail-controller
    spec:
      serviceAccountName: portail-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: ghcr.io/epheo/portail
        args: [controller]
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: sync
          containerPort: 9443
        - name: admin
          containerPort: 19099
        readinessProbe:
          httpGet:
            path: /readyz
            port: admin
        livenessProbe:
          httpGet:
            path: /livez
            port: admin
        # A data plane's defaults (operator parity). The controller caches
        # every TLS Secret in the cluster: raise the memory limit with many.
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: "2"
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
---
# ClusterIP, not headless: data planes reach the service CIDR wherever
# cluster DNS works, including pods whose default route leaves through a
# Multus interface; pod IPs are not always routable from there.
apiVersion: v1
kind: Service
metadata:
  name: portail-controller
  namespace: portail-system
  labels:
    app.kubernetes.io/name: portail-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portail-controller
  ports:
  - name: sync
    port: 9443
    targetPort: sync
