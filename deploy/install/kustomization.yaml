apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: kustomize does not know GatewayClass is
# cluster-scoped and would give it a namespace.
resources:
- namespace.yaml
- ../crds
- rbac.yaml
- controller.yaml
- gatewayclass.yaml
images:
- name: ghcr.io/epheo/portail
  # scripts/release.sh sets it; publish.yml refuses a tag it does not match.
  newTag: "0.1.29"
