apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Two controller replicas: one leads, the other keeps its caches warm and
# takes the lease within one retry when the leader goes.
resources:
- ../install
- pdb.yaml
patches:
- target:
    kind: Deployment
    name: portail-controller
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: portail-controller
    spec:
      replicas: 2
      template:
        spec:
          # Soft: a single-node cluster still schedules both.
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: portail-controller
