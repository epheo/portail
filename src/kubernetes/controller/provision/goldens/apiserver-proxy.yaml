apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: portail-controller
    app.kubernetes.io/name: portail
    gateway.networking.k8s.io/gateway-name: svc-gw
    portail.epheo.eu/controller-name: epheo.eu-portail-afb1ac62
    portail.epheo.eu/gateway: svc-gw
  name: portail-svc-gw
  namespace: edge
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    controller: true
    kind: Gateway
    name: svc-gw
    uid: svc-gw-uid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: portail-controller
    app.kubernetes.io/name: portail
    gateway.networking.k8s.io/gateway-name: svc-gw
    portail.epheo.eu/controller-name: epheo.eu-portail-afb1ac62
    portail.epheo.eu/gateway: svc-gw
  name: portail-svc-gw
  namespace: edge
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    controller: true
    kind: Gateway
    name: svc-gw
    uid: svc-gw-uid
spec:
  replicas: 1
  selector:
    matchLabels:
      portail.epheo.eu/gateway: svc-gw
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: portail-controller
        app.kubernetes.io/name: portail
        gateway.networking.k8s.io/gateway-name: svc-gw
        portail.epheo.eu/controller-name: epheo.eu-portail-afb1ac62
        portail.epheo.eu/gateway: svc-gw
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - dataplane
        - --gateway
        - edge/svc-gw
        - --controller-address
        - https://portail-controller.portail-system.svc:9443
        - --admin-address
        - $(POD_IP)
        - --transport
        - apiserver-proxy
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PORTAIL_CONTROLLER_CA
          value: |
            -----BEGIN CERTIFICATE-----
            MIIB
            -----END CERTIFICATE-----
        - name: PORTAIL_WORKER_THREADS
          value: '2'
        image: ghcr.io/epheo/portail:test
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: 19099
          periodSeconds: 10
        name: portail
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /readyz
            port: 19099
          periodSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /livez
            port: 19099
          periodSeconds: 1
        volumeMounts:
        - mountPath: /var/run/secrets/portail.epheo.eu/controller
          name: controller-token
          readOnly: true
        - mountPath: /var/run/secrets/portail.epheo.eu/apiserver
          name: apiserver-token
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: portail-svc-gw
      terminationGracePeriodSeconds: 40
      volumes:
      - name: controller-token
        projected:
          sources:
          - serviceAccountToken:
              audience: portail-controller.portail-system.svc
              expirationSeconds: 3600
              path: token
      - name: apiserver-token
        projected:
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: portail-controller
    app.kubernetes.io/name: portail
    gateway.networking.k8s.io/gateway-name: svc-gw
    portail.epheo.eu/controller-name: epheo.eu-portail-afb1ac62
    portail.epheo.eu/gateway: svc-gw
  name: portail-svc-gw
  namespace: edge
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    controller: true
    kind: Gateway
    name: svc-gw
    uid: svc-gw-uid
spec:
  ports:
  - name: tcp-8080
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    portail.epheo.eu/gateway: svc-gw
  type: ClusterIP
